<!DOCTYPE html>
<html>
<head>
    <title>X TG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #03050a;
            color: white;
            font-family: "Trebuchet MS", Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -180px;
            left: 50%;
            width: 650px;
            height: 350px;
            transform: translateX(-50%);
            background: #008cff;
            filter: blur(110px);
            opacity: 0.65;
            z-index: -1;
        }

        .judul {
            margin-top: 30px;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 15px #ffffff55;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .kotak {
            width: 85%;
            max-width: 500px;
            margin: 55px auto 45px;
            padding: 38px 20px;
            border-radius: 28px;
            background: #111827;
            border: 1px solid #1e3a5f;

            box-shadow:
                0 0 20px #006eff44,
                inset 0 0 20px #ffffff05;
        }

        .kotak h2 {
            margin: 0;
            font-size: 34px;
        }

        .tombol {
            display: block;
            width: 85%;
            max-width: 380px;
            margin: 25px auto;
            padding: 20px;

            background: #0b1040;
            color: #cbd5ff;

            border: 1px solid #151b68;
            border-radius: 12px;

            font-size: 27px;
            font-weight: bold;
            text-decoration: none;

            box-shadow: 0 0 15px #1824a044;
            transition: 0.25s;
        }

        .tombol:hover {
            transform: translateY(-3px);
            background: #12195c;
            box-shadow: 0 0 25px #236bff77;
        }


        /* =====================
           HALAMAN FOTBAR
        ===================== */

        #halamanFotbar {
            display: none;
            min-height: 100vh;
            padding: 25px 15px 60px;
            animation: masuk 0.6s ease;
        }

        @keyframes masuk {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            padding: 12px 22px;

            background: #0b1040;
            color: white;

            border: 1px solid #3155ff;
            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .judulAlbum {
            font-size: 32px;
            margin-bottom: 25px;
        }

        /* FOTO UTAMA */

        .fotoUtama {
            width: fit-content;
            max-width: 90%;
            margin: 0 auto 40px;

            padding: 8px;
            border-radius: 20px;
            background: #111827;

            box-shadow: 0 0 35px #006eff66;

            animation: ledak 0.8s ease;
        }

        .fotoUtama img {
            display: block;
            max-width: 100%;
            max-height: 55vh;

            width: auto;
            height: auto;

            border-radius: 14px;
            cursor: pointer;
        }

        @keyframes ledak {
            0% {
                transform: scale(0.1) rotate(-10deg);
                opacity: 0;
            }

            60% {
                transform: scale(1.15) rotate(3deg);
            }

            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        /* ALBUM */

        .album {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;

            max-width: 900px;
            margin: auto;
        }

        .foto {
            background: #111827;
            padding: 7px;
            border-radius: 16px;

            border: 1px solid #1e3a5f;

            box-shadow: 0 0 15px #006eff33;

            cursor: pointer;

            animation: pecah 0.7s ease both;
        }

        .foto:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #008cff88;
        }

        .foto img {
            display: block;
            width: 100%;
            height: 180px;

            object-fit: contain;

            border-radius: 10px;
        }

        @keyframes pecah {
            0% {
                opacity: 0;
                transform: scale(0) rotate(20deg);
            }

            70% {
                transform: scale(1.1) rotate(-3deg);
            }

            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }


        /* =====================
           FULL SCREEN FOTO
        ===================== */

        #viewer {
            display: none;

            position: fixed;
            inset: 0;

            background: #000000ee;

            z-index: 999;

            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        #viewer img {
            max-width: 95vw;
            max-height: 92vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 12px;

            box-shadow: 0 0 40px #008cff88;
        }

        .tutup {
            position: fixed;

            top: 20px;
            right: 20px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #111827;
            color: white;

            border: 1px solid #3155ff;

            font-size: 25px;

            cursor: pointer;

            z-index: 1000;
        }

    </style>
</head>


<body>

    <!-- HALAMAN UTAMA -->

    <div id="halamanUtama">

        <div class="logo">X TG</div>

        <div class="judul">
            Selamat Datang
        </div>

        <div class="kotak">

            <h2>Mau apa nih?</h2>

            <button class="tombol" onclick="bukaFotbar()">
                Fotbar X TG
            </button>

            <a href="sertifikat.jpg" target="_blank" class="tombol">
                Sertifikat Kelas
            </a>

        </div>

    </div>



    <!-- HALAMAN FOTBAR -->

    <div id="halamanFotbar">

        <button class="back" onclick="kembali()">
            Back ↩
        </button>

        <div class="judulAlbum">
            Fotbar X TG 📸
        </div>


        <!-- FOTO UTAMA -->

        <div class="fotoUtama">

            <img
                src="fotbar.jpg"
                onclick="lihatFoto(this.src)"
            >

        </div>


        <!-- ALBUM FOTO -->

        <div class="album">

            <div class="foto">
                <img
                    src="fotbar2.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>

            <div class="foto">
                <img
                    src="fotbar3.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>

            <div class="foto">
                <img
                    src="fotbar4.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>

            <div class="foto">
                <img
                    src="fotbar5.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>

        </div>

    </div>



    <!-- FULL SCREEN -->

    <div id="viewer">

        <button class="tutup" onclick="tutupFoto()">
            ×
        </button>

        <img id="fotoBesar">

    </div>



    <script>

        function bukaFotbar() {

            document.getElementById("halamanUtama").style.display = "none";

            document.getElementById("halamanFotbar").style.display = "block";

        }


        function kembali() {

            document.getElementById("halamanFotbar").style.display = "none";

            document.getElementById("halamanUtama").style.display = "block";

        }


        function lihatFoto(src) {

            document.getElementById("fotoBesar").src = src;

            document.getElementById("viewer").style.display = "flex";

        }


        function tutupFoto() {

            document.getElementById("viewer").style.display = "none";

        }

    </script>

</body>
</html>
