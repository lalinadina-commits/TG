<!DOCTYPE html>
<html>
<head>
    <title>X TG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #03050a;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 250px;
            background: #008cff;
            filter: blur(130px);
            opacity: 0.45;
            z-index: -1;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 25px;
            font-weight: bold;
        }

        .judul {
            text-align: center;
            margin-top: 70px;
            font-size: 35px;
        }

        .kotak {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: #08111f;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 30px #008cff44;
        }

        .tombol {
            display: block;
            width: 90%;
            margin: 15px auto;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #0b5cff;
            color: white;
            font-size: 17px;
            cursor: pointer;
            text-decoration: none;
        }

        .tombol:hover {
            background: #168cff;
        }


        /* =========================
           HALAMAN FOTBAR
        ========================= */

        #halamanFotbar {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        #halamanFotbar h1 {
            margin-bottom: 30px;
        }

        #fotoUtama {
            max-width: 85vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 35px #008cff88;
            cursor: pointer;
            transition: 0.5s;
        }


        /* =========================
           ALBUM
        ========================= */

        #album {
            display: none;
            position: relative;
            width: 100%;
            min-height: 500px;
            margin-top: 30px;
            overflow: hidden;
        }

        .foto {
            position: absolute;
            width: 180px;
            padding: 6px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 25px #008cff77;
            cursor: pointer;
            opacity: 0;
        }

        .foto img {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
        }

        .foto.muncul {
            animation: munculFoto 1.3s forwards;
        }

        @keyframes munculFoto {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.1)
                    rotate(0deg);
            }

            45% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.2)
                    rotate(15deg);
            }

            100% {
                opacity: 1;
            }
        }


        /* =========================
           EFEK KACA UNGU FULLSCREEN
        ========================= */

        #efekKaca {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(
                    circle at center,
                    #d000ffcc 0%,
                    #7b00ff99 25%,
                    #260052dd 60%,
                    #05000ddd 100%
                );
            z-index: 999;
            overflow: hidden;
            pointer-events: none;
        }

        /* cahaya ungu */

        #efekKaca::before {
            content: "";
            position: absolute;
            inset: -50%;
            background:
                radial-gradient(
                    circle,
                    #ffffff99 0%,
                    #c000ff55 15%,
                    transparent 45%
                );
            animation: cahayaUngu 1.4s ease-out forwards;
        }

        @keyframes cahayaUngu {

            0% {
                transform: scale(0.1);
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                transform: scale(2);
                opacity: 0;
            }
        }


        /* garis retakan kaca */

        .retak {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 3px;
            height: 50vh;
            background:
                linear-gradient(
                    transparent,
                    #ffffffdd,
                    #c800ffff,
                    transparent
                );
            transform-origin: center bottom;
            opacity: 0;

            animation:
                retakMuncul 0.5s ease-out forwards,
                retakHilang 1.2s 0.4s forwards;
        }

        @keyframes retakMuncul {

            0% {
                transform:
                    rotate(var(--angle))
                    scaleY(0);
                opacity: 0;
            }

            100% {
                transform:
                    rotate(var(--angle))
                    scaleY(1);
                opacity: 1;
            }
        }

        @keyframes retakHilang {

            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }


        /* pecahan kaca */

        .pecahan {
            position: absolute;
            left: 50%;
            top: 50%;

            width: 80px;
            height: 80px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff44,
                    #b000ff66,
                    #6f00ff22
                );

            border:
                2px solid #ffffffaa;

            backdrop-filter: blur(4px);

            clip-path: polygon(
                50% 0%,
                100% 35%,
                75% 100%,
                20% 80%,
                0% 25%
            );

            opacity: 0;

            animation: pecahUngu 1.4s ease-out forwards;
        }

        @keyframes pecahUngu {

            0% {
                opacity: 0;
                transform:
                    translate(-50%, -50%)
                    scale(0.1)
                    rotate(0deg);
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(0.4)
                    rotate(var(--rotasi));
            }
        }


        /* flash putih-ungu */

        #flashUngu {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle,
                    white,
                    #d000ffff 15%,
                    #7200ffff 40%,
                    transparent 70%
                );

            opacity: 0;

            animation:
                flash 0.7s ease-out forwards;
        }

        @keyframes flash {

            0% {
                opacity: 0;
                transform: scale(0.2);
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: scale(2);
            }
        }


        /* =========================
           FULLSCREEN FOTO
        ========================= */

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000ee;
            z-index: 2000;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        #viewer img {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;

            border-radius: 10px;

            box-shadow:
                0 0 40px #9d00ff99;
        }

        #tutup {
            position: absolute;
            top: 20px;
            right: 25px;

            font-size: 35px;
            cursor: pointer;
            z-index: 5;
        }

        #kembali {
            margin-top: 25px;
        }

    </style>
</head>


<body>

    <div class="logo">
        X TG
    </div>


    <h1 class="judul">
        Selamat Datang
    </h1>


    <!-- =====================
         HALAMAN UTAMA
    ====================== -->

    <div id="halamanUtama" class="kotak">

        <h2>
            Mau apa nih?
        </h2>

        <button
            class="tombol"
            onclick="bukaFotbar()">

            Fotbar X TG

        </button>


        <a
            href="sertifikat.jpg"
            class="tombol">

            Sertifikat Kelas

        </a>

    </div>


    <!-- =====================
         HALAMAN FOTBAR
    ====================== -->

    <div id="halamanFotbar">

        <h1>
            Fotbar X TG 📸
        </h1>


        <!-- FOTO UTAMA -->

        <img
            id="fotoUtama"
            src="fotbar.jpg"
            onclick="pecahkanFoto()"
        >


        <!-- ALBUM -->

        <div id="album">

            <div class="foto">
                <img
                    src="fotbar.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>


            <div class="foto">
                <img
                    src="fotbar2.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>


            <div class="foto">
                <img
                    src="fotbar3.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>


            <div class="foto">
                <img
                    src="fotbar4.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>


            <div class="foto">
                <img
                    src="fotbar5.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>


            <div class="foto">
                <img
                    src="fotbar6.jpg"
                    onclick="lihatFoto(this.src)"
                >
            </div>

        </div>


        <button
            id="kembali"
            class="tombol"
            onclick="kembali()">

            ↩ Kembali

        </button>

    </div>


    <!-- =====================
         EFEK KACA UNGU
    ====================== -->

    <div id="efekKaca">

        <div id="flashUngu"></div>

    </div>


    <!-- =====================
         FULLSCREEN FOTO
    ====================== -->

    <div
        id="viewer"
        onclick="tutupFoto()">

        <span id="tutup">
            ✕
        </span>

        <img id="fotoBesar">

    </div>


    <script>

        /* =====================
           BUKA FOTBAR
        ====================== */

        function bukaFotbar() {

            document.getElementById(
                "halamanUtama"
            ).style.display = "none";


            document.getElementById(
                "halamanFotbar"
            ).style.display = "block";

        }


        /* =====================
           EFEK KACA UNGU
        ====================== */

        function pecahkanFoto() {

            let fotoUtama =
                document.getElementById(
                    "fotoUtama"
                );

            let efek =
                document.getElementById(
                    "efekKaca"
                );

            let album =
                document.getElementById(
                    "album"
                );


            /* tampilkan efek */

            efek.style.display = "block";


            /* cegah scroll */

            document.body.style.overflow =
                "hidden";


            /* =====================
               RETAKAN KACA
            ====================== */

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                let retak =
                    document.createElement(
                        "div"
                    );

                retak.className =
                    "retak";


                retak.style.setProperty(
                    "--angle",
                    (i * 20) + "deg"
                );


                efek.appendChild(retak);


                setTimeout(() => {
                    retak.remove();
                }, 1800);

            }


            /* =====================
               PECAHAN KACA
            ====================== */

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                let pecahan =
                    document.createElement(
                        "div"
                    );

                pecahan.className =
                    "pecahan";


                let sudut =
                    Math.random() * Math.PI * 2;

                let jarak =
                    300 + Math.random() * 700;


                let x =
                    Math.cos(sudut)
                    * jarak;

                let y =
                    Math.sin(sudut)
                    * jarak;


                pecahan.style.setProperty(
                    "--x",
                    x + "px"
                );


                pecahan.style.setProperty(
                    "--y",
                    y + "px"
                );


                pecahan.style.setProperty(
                    "--rotasi",
                    (
                        Math.random() * 720
                        - 360
                    ) + "deg"
                );


                pecahan.style.width =
                    (30 + Math.random() * 100)
                    + "px";


                pecahan.style.height =
                    (30 + Math.random() * 100)
                    + "px";


                efek.appendChild(
                    pecahan
                );


                setTimeout(() => {
                    pecahan.remove();
                }, 1600);

            }


            /* =====================
               FOTO UTAMA MENGHILANG
            ====================== */

            fotoUtama.style.transition =
                "0.5s";

            fotoUtama.style.transform =
                "scale(1.3)";

            fotoUtama.style.opacity =
                "0";


            /* =====================
               TAMPILKAN ALBUM
            ====================== */

            setTimeout(() => {

                fotoUtama.style.display =
                    "none";


                album.style.display =
                    "block";


                let foto =
                    document.querySelectorAll(
                        ".foto"
                    );


                let posisi = [

                    ["18%", "25%", "-15deg"],

                    ["50%", "18%", "8deg"],

                    ["82%", "25%", "18deg"],

                    ["20%", "68%", "10deg"],

                    ["52%", "72%", "-8deg"],

                    ["82%", "65%", "-18deg"]

                ];


                foto.forEach(
                    (item, index) => {

                        item.style.left =
                            posisi[index][0];

                        item.style.top =
                            posisi[index][1];


                        item.style.setProperty(
                            "--rotasi",
                            posisi[index][2]
                        );


                        item.classList.add(
                            "muncul"
                        );


                        item.style.transform =
                            "translate(-50%, -50%) rotate("
                            + posisi[index][2]
                            + ")";

                    }
                );


                /* matikan efek */

                setTimeout(() => {

                    efek.style.display =
                        "none";

                    document.body.style.overflow =
                        "auto";

                }, 700);


            }, 1300);

        }


        /* =====================
           LIHAT FOTO
        ====================== */

        function lihatFoto(src) {

            document.getElementById(
                "fotoBesar"
            ).src = src;


            document.getElementById(
                "viewer"
            ).style.display = "flex";

        }


        /* =====================
           TUTUP FOTO
        ====================== */

        function tutupFoto() {

            document.getElementById(
                "viewer"
            ).style.display = "none";

        }


        /* =====================
           KEMBALI
        ====================== */

        function kembali() {

            document.getElementById(
                "halamanFotbar"
            ).style.display = "none";


            document.getElementById(
                "halamanUtama"
            ).style.display = "block";


            let fotoUtama =
                document.getElementById(
                    "fotoUtama"
                );


            fotoUtama.style.display =
                "inline-block";

            fotoUtama.style.opacity =
                "1";

            fotoUtama.style.transform =
                "scale(1)";


            document.getElementById(
                "album"
            ).style.display = "none";


            document.body.style.overflow =
                "auto";

        }

    </script>

</body>
</html>
