<!DOCTYPE html>
<html>
<head>
    <title>X TG</title>

    <style>
        body {
            margin: 0;
            background: #05070d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -150px;
            left: 50%;
            width: 600px;
            height: 300px;
            transform: translateX(-50%);
            background: #008cff;
            filter: blur(100px);
            opacity: 0.7;
            z-index: -1;
        }

        h1 {
            margin-top: 50px;
            font-size: 36px;
        }

        .kotak {
            width: 80%;
            max-width: 500px;
            margin: 70px auto;
            padding: 60px 20px;
            background: rgba(20, 25, 40, 0.9);
            border-radius: 30px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.3);
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            letter-spacing: 8px;
            color: #4db8ff;
            text-shadow: 0 0 20px #008cff;
        }
    </style>
</head>

<body>

    <h1>Selamat Datang</h1>

    <div class="kotak">
        <div class="logo">X TG</div>
    </div>

</body>
</html>
