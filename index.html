<!DOCTYPE html>
<html>
<head>
    <title>X TG</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #02050b;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND
        ========================= */

        body {
            background:
                radial-gradient(
                    circle at 50% 100%,
                    #003b72,
                    #02050b 55%
                );
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            position: absolute;
            top: 20px;
            left: 25px;

            font-size: 25px;
            font-weight: bold;

            color: white;

            text-shadow:
                0 0 8px #008cff,
                0 0 20px #008cff;
        }


        .judul {
            text-align: center;

            margin-top: 75px;

            font-size: 35px;

            text-shadow:
                0 0 10px #008cff,
                0 0 25px #0066ff;
        }


        /* =========================
           BOX MENU
        ========================= */

        .kotak {
            width: 90%;
            max-width: 500px;

            margin: 40px auto;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    #071a32,
                    #020b18
                );

            border-radius: 30px;

            text-align: center;

            border: 1px solid #087cff55;

            box-shadow:
                0 0 15px #008cff44,
                0 0 40px #0066ff22;
        }


        /* =========================
           TOMBOL BIRU DONGKER
        ========================= */

        .tombol {

            display: block;

            width: 90%;

            margin: 18px auto;

            padding: 17px;

            border-radius: 18px;

            border: 1px solid #168cff88;

            background:
                linear-gradient(
                    145deg,
                    #09264b,
                    #031124
                );

            color: white;

            font-size: 17px;

            cursor: pointer;

            text-decoration: none;

            box-shadow:
                0 0 8px #008cff66,
                0 0 18px #008cff33,
                inset 0 0 12px #008cff22;

            transition: 0.25s;
        }


        .tombol:hover {

            transform: scale(1.03);

            border-color: #25a4ff;

            box-shadow:
                0 0 12px #008cff,
                0 0 30px #008cff66,
                inset 0 0 18px #008cff44;
        }


        /* =========================
           HALAMAN
        ========================= */

        .halaman {

            display: none;

            width: 100%;

            min-height: 100vh;

            padding-top: 80px;

            text-align: center;

            overflow: hidden;
        }


        .halaman h1 {

            text-shadow:
                0 0 10px #008cff,
                0 0 20px #0066ff;
        }


        /* =================================================
           CAROUSEL
        ================================================= */

        .carousel {

            position: relative;

            width: 100%;

            height: 430px;

            margin-top: 30px;

            overflow: hidden;

            touch-action: pan-y;
        }


        .track {

            position: absolute;

            left: 50%;
            top: 50%;

            width: 0;
            height: 0;
        }


        /* =========================
           KARTU FOTO
        ========================= */

        .kartu {

            position: absolute;

            left: 0;
            top: 0;

            width: 230px;
            height: 300px;

            padding: 7px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #12345c,
                    #041021
                );

            border:
                1px solid #178fff99;

            box-shadow:
                0 0 12px #008cff77,
                0 0 30px #0066ff33;

            overflow: hidden;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.18s ease-out,
                opacity 0.18s ease-out,
                filter 0.18s ease-out;
        }


        .kartu img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 13px;

            pointer-events: none;
        }


        /* =========================
           FOTO TENGAH
        ========================= */

        .kartu.tengah {

            box-shadow:
                0 0 15px #008cff,
                0 0 40px #008cff99,
                0 0 80px #0066ff44;

            border-color: #35aeff;
        }


        /* =========================
           PETUNJUK SWIPE
        ========================= */

        .petunjuk {

            opacity: 0.6;

            font-size: 14px;

            margin-top: 10px;
        }


        /* =========================
           FULLSCREEN
        ========================= */

        #viewer {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            background:
                rgba(0, 5, 15, 0.96);

            justify-content: center;
            align-items: center;

            padding: 15px;
        }


        #viewer img {

            max-width: 96vw;
            max-height: 92vh;

            object-fit: contain;

            border-radius: 12px;

            box-shadow:
                0 0 20px #008cff,
                0 0 60px #0066ff66;
        }


        #tutup {

            position: absolute;

            right: 20px;
            top: 15px;

            font-size: 35px;

            cursor: pointer;

            text-shadow:
                0 0 10px #008cff;
        }


        /* =========================
           TOMBOL KEMBALI
        ========================= */

        .kembali {

            width: 200px;

            margin: 10px auto 30px;
        }

    </style>
</head>


<body>


    <!-- =========================
         MENU UTAMA
    ========================= -->

    <div id="menu">

        <div class="logo">
            X TG
        </div>


        <h1 class="judul">
            Selamat Datang
        </h1>


        <div class="kotak">

            <h2>
                Mau apa nih?
            </h2>


            <button
                class="tombol"
                onclick="bukaFotbar()">

                📸 Fotbar X TG

            </button>


            <button
                class="tombol"
                onclick="bukaSertifikat()">

                🏆 Sertifikat Kelas

            </button>

        </div>

    </div>



    <!-- =========================
         FOTBAR
    ========================= -->

    <div
        id="halamanFotbar"
        class="halaman">

        <h1>
            Fotbar X TG 📸
        </h1>


        <div
            class="carousel"
            id="carouselFotbar">

            <div
                class="track"
                id="trackFotbar">

            </div>

        </div>


        <div class="petunjuk">
            ← Geser untuk melihat foto →
        </div>


        <button
            class="tombol kembali"
            onclick="kembaliMenu()">

            ↩ Kembali

        </button>

    </div>



    <!-- =========================
         SERTIFIKAT
    ========================= -->

    <div
        id="halamanSertifikat"
        class="halaman">

        <h1>
            Sertifikat Kelas 🏆
        </h1>


        <div
            class="carousel"
            id="carouselSertifikat">

            <div
                class="track"
                id="trackSertifikat">

            </div>

        </div>


        <div class="petunjuk">
            ← Geser untuk melihat sertifikat →
        </div>


        <button
            class="tombol kembali"
            onclick="kembaliMenu()">

            ↩ Kembali

        </button>

    </div>



    <!-- =========================
         FULLSCREEN FOTO
    ========================= -->

    <div
        id="viewer"
        onclick="tutupFoto()">

        <span id="tutup">
            ✕
        </span>

        <img id="fotoBesar">

    </div>



<script>


/* =====================================================
   DAFTAR FOTO
===================================================== */

/*
   Tinggal tambahkan nama file di sini.

   Contoh:

   "fotbar7.jpg",
   "fotbar8.jpg",
   "fotbar9.jpg"

   Mau 10, 50, atau 100 foto juga bisa.
*/

const fotoFotbar = [

    "IMG-20260805-WA0017.jpg",
    "fotbar2.jpg",
    "fotbar3.jpg",
    "fotbar4.jpg",
    "fotbar5.jpg",
    "fotbar6.jpg"

];


/* =========================
   FOTO SERTIFIKAT
========================= */

const fotoSertifikat = [

    "IMG-20260817-WA0023.jpg",
    "sertifikat2.jpg",
    "sertifikat3.jpg",
    "sertifikat4.jpg"

];



/* =====================================================
   DATA CAROUSEL
===================================================== */

let carouselAktif = null;

let posisiFotbar = 0;
let posisiSertifikat = 0;



/* =====================================================
   BUAT FOTO
===================================================== */

function buatFoto(
    daftar,
    track,
    tipe
) {

    track.innerHTML = "";


    daftar.forEach(
        (src, index) => {

            const kartu =
                document.createElement(
                    "div"
                );


            kartu.className =
                "kartu";


            const img =
                document.createElement(
                    "img"
                );


            img.src = src;


            kartu.appendChild(img);


            kartu.addEventListener(
                "click",
                function() {

                    let posisi;

                    if (
                        tipe === "fotbar"
                    ) {

                        posisi =
                            posisiFotbar;

                    } else {

                        posisi =
                            posisiSertifikat;

                    }


                    /*
                       Kalau foto yang
                       ditekan adalah foto
                       tengah → fullscreen.
                    */

                    if (
                        index === posisi
                    ) {

                        lihatFoto(src);

                    }

                    /*
                       Kalau bukan tengah,
                       jadikan dia tengah.
                    */

                    else {

                        if (
                            tipe === "fotbar"
                        ) {

                            posisiFotbar =
                                index;

                        } else {

                            posisiSertifikat =
                                index;
                        }


                        renderCarousel(
                            daftar,
                            track,
                            tipe
                        );
                    }

                }
            );


            track.appendChild(kartu);

        }
    );


    renderCarousel(
        daftar,
        track,
        tipe
    );
}



/* =====================================================
   RENDER CAROUSEL
===================================================== */

function renderCarousel(
    daftar,
    track,
    tipe
) {

    let posisi;


    if (
        tipe === "fotbar"
    ) {

        posisi =
            posisiFotbar;

    } else {

        posisi =
            posisiSertifikat;

    }


    const kartu =
        track.querySelectorAll(
            ".kartu"
        );


    kartu.forEach(
        (item, index) => {

            /*
               Jarak dari foto tengah
            */

            let jarak =
                index - posisi;


            /*
               Untuk carousel tak terbatas:
               posisi dibungkus ke ujung.
            */

            const panjang =
                daftar.length;


            if (
                jarak >
                panjang / 2
            ) {

                jarak -= panjang;

            }


            if (
                jarak <
                -panjang / 2
            ) {

                jarak += panjang;

            }


            /*
               POSISI HORIZONTAL
            */

            let x =
                jarak * 210;


            /*
               FOTO TENGAH BESAR
            */

            let scale =
                Math.max(
                    0.62,
                    1 -
                    Math.abs(jarak)
                    * 0.16
                );


            /*
               Sedikit naik/turun
            */

            let y =
                Math.abs(jarak)
                * 15;


            /*
               Foto jauh makin transparan
            */

            let opacity =
                Math.max(
                    0,
                    1 -
                    Math.abs(jarak)
                    * 0.25
                );


            /*
               Sedikit diputar
            */

            let rotate =
                jarak * -5;


            item.style.transform =

                "translate(" +
                (x - 50) +
                "%, " +
                (-50 + y / 3) +
                "%) " +

                "scale(" +
                scale +
                ") " +

                "rotate(" +
                rotate +
                "deg)";


            item.style.opacity =
                opacity;


            item.style.zIndex =
                100 -
                Math.abs(jarak);


            item.style.filter =

                "brightness(" +
                (
                    1 -
                    Math.abs(jarak)
                    * 0.12
                ) +
                ")";


            item.classList.toggle(
                "tengah",
                jarak === 0
            );

        }
    );
}



/* =====================================================
   BUKA FOTBAR
===================================================== */

function bukaFotbar() {

    document.getElementById(
        "menu"
    ).style.display = "none";


    document.getElementById(
        "halamanFotbar"
    ).style.display = "block";


    buatFoto(
        fotoFotbar,
        document.getElementById(
            "trackFotbar"
        ),
        "fotbar"
    );
}



/* =====================================================
   BUKA SERTIFIKAT
===================================================== */

function bukaSertifikat() {

    document.getElementById(
        "menu"
    ).style.display = "none";


    document.getElementById(
        "halamanSertifikat"
    ).style.display = "block";


    buatFoto(
        fotoSertifikat,
        document.getElementById(
            "trackSertifikat"
        ),
        "sertifikat"
    );
}



/* =====================================================
   SWIPE
===================================================== */

function aktifkanSwipe(
    carousel,
    tipe
) {

    let awalX = 0;
    let awalY = 0;


    carousel.addEventListener(
        "touchstart",
        function(e) {

            awalX =
                e.touches[0].clientX;

            awalY =
                e.touches[0].clientY;

        },
        { passive: true }
    );


    carousel.addEventListener(
        "touchend",
        function(e) {

            let akhirX =
                e.changedTouches[0]
                .clientX;

            let akhirY =
                e.changedTouches[0]
                .clientY;


            let dx =
                akhirX - awalX;

            let dy =
                akhirY - awalY;


            /*
               Jangan anggap scroll
               vertikal sebagai swipe.
            */

            if (
                Math.abs(dx) <
                40 ||
                Math.abs(dx) <
                Math.abs(dy)
            ) {

                return;
            }


            const daftar =
                tipe === "fotbar"
                ? fotoFotbar
                : fotoSertifikat;


            /*
               GESER KIRI
            */

            if (dx < 0) {

                if (
                    tipe === "fotbar"
                ) {

                    posisiFotbar++;

                    if (
                        posisiFotbar >=
                        daftar.length
                    ) {

                        posisiFotbar = 0;
                    }

                } else {

                    posisiSertifikat++;

                    if (
                        posisiSertifikat >=
                        daftar.length
                    ) {

                        posisiSertifikat = 0;
                    }
                }

            }


            /*
               GESER KANAN
            */

            else {

                if (
                    tipe === "fotbar"
                ) {

                    posisiFotbar--;

                    if (
                        posisiFotbar < 0
                    ) {

                        posisiFotbar =
                            daftar.length - 1;
                    }

                } else {

                    posisiSertifikat--;

                    if (
                        posisiSertifikat < 0
                    ) {

                        posisiSertifikat =
                            daftar.length - 1;
                    }
                }

            }


            renderCarousel(
                daftar,
                tipe === "fotbar"
                ? document.getElementById(
                    "trackFotbar"
                )
                : document.getElementById(
                    "trackSertifikat"
                ),
                tipe
            );

        }
    );
}



/* =====================================================
   PASANG SWIPE
===================================================== */

aktifkanSwipe(
    document.getElementById(
        "carouselFotbar"
    ),
    "fotbar"
);


aktifkanSwipe(
    document.getElementById(
        "carouselSertifikat"
    ),
    "sertifikat"
);



/* =====================================================
   LIHAT FOTO FULLSCREEN
===================================================== */

function lihatFoto(src) {

    document.getElementById(
        "fotoBesar"
    ).src = src;


    document.getElementById(
        "viewer"
    ).style.display = "flex";
}



/* =====================================================
   TUTUP FOTO
===================================================== */

function tutupFoto() {

    document.getElementById(
        "viewer"
    ).style.display = "none";
}



/* =====================================================
   KEMBALI
===================================================== */

function kembaliMenu() {

    document.getElementById(
        "halamanFotbar"
    ).style.display = "none";


    document.getElementById(
        "halamanSertifikat"
    ).style.display = "none";


    document.getElementById(
        "menu"
    ).style.display = "block";

}

</script>

</body>
</html>
