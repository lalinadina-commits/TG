<!DOCTYPE html>
<html>
<head>
    <title>X TG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #03050a;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 250px;
            background: #008cff;
            filter: blur(130px);
            opacity: 0.45;
            z-index: -1;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 25px;
            font-weight: bold;
        }

        .judul {
            text-align: center;
            margin-top: 70px;
            font-size: 35px;
        }

        .kotak {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: #08111f;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 0 30px #008cff44;
        }

        .tombol {
            display: block;
            width: 90%;
            margin: 15px auto;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #0b5cff;
            color: white;
            font-size: 17px;
            cursor: pointer;
            text-decoration: none;
        }

        .tombol:hover {
            background: #168cff;
        }

        /* HALAMAN FOTBAR */

        #halamanFotbar {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        #halamanFotbar h1 {
            margin-bottom: 30px;
        }

        /* FOTO UTAMA */

        #fotoUtama {
            max-width: 85vw;
            max-height: 65vh;
            width: auto;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 35px #008cff88;
            cursor: pointer;
            transition: 0.4s;
        }

        #fotoUtama:hover {
            transform: scale(1.03);
        }

        /* AREA ALBUM */

        #album {
            display: none;
            position: relative;
            width: 100%;
            min-height: 500px;
            margin-top: 30px;
            overflow: hidden;
        }

        .foto {
            position: absolute;
            width: 180px;
            padding: 6px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 25px #008cff77;
            cursor: pointer;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.1) rotate(0deg);
        }

        .foto img {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* ANIMASI FOTO MENYEBAR */

        .foto.muncul {
            animation: pecah 1.3s forwards;
        }

        @keyframes pecah {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.1) rotate(0deg);
            }

            35% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.25) rotate(15deg);
            }

            100% {
                opacity: 1;
            }
        }

        /* EFEK PECAHAN KACA */

        .pecahan {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            background: #ffffff22;
            backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 50;
            animation: kaca 1s forwards;
        }

        @keyframes kaca {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }

            100% {
                opacity: 0;
                transform:
                    translate(var(--x), var(--y))
                    rotate(var(--r))
                    scale(0.2);
            }
        }

        /* FULLSCREEN */

        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000ee;
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #viewer img {
            max-width: 95vw;
            max-height: 92vh;
            width: auto;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 40px #008cff99;
        }

        #tutup {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 35px;
            cursor: pointer;
        }

        #kembali {
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="logo">X TG</div>

    <h1 class="judul">Selamat Datang</h1>

    <!-- HALAMAN UTAMA -->

    <div id="halamanUtama" class="kotak">

        <h2>Mau apa nih?</h2>

        <button class="tombol" onclick="bukaFotbar()">
            Fotbar X TG
        </button>

        <a href="sertifikat.jpg" class="tombol">
            Sertifikat Kelas
        </a>

    </div>


    <!-- HALAMAN FOTBAR -->

    <div id="halamanFotbar">

        <h1>Fotbar X TG 📸</h1>

        <!-- FOTO PERTAMA -->

        <img
            id="fotoUtama"
            src="fotbar.jpg"
            onclick="pecahkanFoto()"
        >

        <!-- ALBUM -->

        <div id="album">

            <div class="foto">
                <img src="fotbar.jpg" onclick="lihatFoto(this.src)">
            </div>

            <div class="foto">
                <img src="fotbar2.jpg" onclick="lihatFoto(this.src)">
            </div>

            <div class="foto">
                <img src="fotbar3.jpg" onclick="lihatFoto(this.src)">
            </div>

            <div class="foto">
                <img src="fotbar4.jpg" onclick="lihatFoto(this.src)">
            </div>

            <div class="foto">
                <img src="fotbar5.jpg" onclick="lihatFoto(this.src)">
            </div>

            <div class="foto">
                <img src="fotbar6.jpg" onclick="lihatFoto(this.src)">
            </div>

        </div>

        <button
            id="kembali"
            class="tombol"
            onclick="kembali()">
            ↩ Kembali
        </button>

    </div>


    <!-- FULLSCREEN -->

    <div id="viewer" onclick="tutupFoto()">

        <span id="tutup">✕</span>

        <img id="fotoBesar">

    </div>


    <script>

        function bukaFotbar() {

            document.getElementById("halamanUtama").style.display = "none";

            document.getElementById("halamanFotbar").style.display = "block";

        }


        function pecahkanFoto() {

            let fotoUtama =
                document.getElementById("fotoUtama");

            let album =
                document.getElementById("album");

            /* buat pecahan kaca */

            for (let i = 0; i < 25; i++) {

                let pecahan =
                    document.createElement("div");

                pecahan.className = "pecahan";

                pecahan.style.left =
                    "50%";

                pecahan.style.top =
                    "45%";

                pecahan.style.setProperty(
                    "--x",
                    (Math.random() * 600 - 300) + "px"
                );

                pecahan.style.setProperty(
                    "--y",
                    (Math.random() * 500 - 250) + "px"
                );

                pecahan.style.setProperty(
                    "--r",
                    (Math.random() * 720 - 360) + "deg"
                );

                document.body.appendChild(pecahan);

                setTimeout(() => {
                    pecahan.remove();
                }, 1000);
            }


            /* sembunyikan foto utama */

            fotoUtama.style.transition =
                "0.4s";

            fotoUtama.style.transform =
                "scale(1.4)";

            fotoUtama.style.opacity =
                "0";


            /* tampilkan album */

            setTimeout(() => {

                fotoUtama.style.display =
                    "none";

                album.style.display =
                    "block";

                let foto =
                    document.querySelectorAll(".foto");


                let posisi = [

                    ["20%", "25%", "-15deg"],
                    ["50%", "20%", "8deg"],
                    ["80%", "25%", "18deg"],
                    ["25%", "65%", "10deg"],
                    ["55%", "70%", "-8deg"],
                    ["80%", "65%", "-18deg"]

                ];


                foto.forEach((item, index) => {

                    item.style.left =
                        posisi[index][0];

                    item.style.top =
                        posisi[index][1];

                    item.style.setProperty(
                        "--rotasi",
                        posisi[index][2]
                    );

                    item.classList.add("muncul");

                    item.style.transform =
                        "translate(-50%, -50%) rotate(" +
                        posisi[index][2] +
                        ")";

                });

            }, 800);

        }


        function lihatFoto(src) {

            document.getElementById("fotoBesar").src =
                src;

            document.getElementById("viewer").style.display =
                "flex";

        }


        function tutupFoto() {

            document.getElementById("viewer").style.display =
                "none";

        }


        function kembali() {

            document.getElementById("halamanFotbar").style.display =
                "none";

            document.getElementById("halamanUtama").style.display =
                "block";

            document.getElementById("fotoUtama").style.display =
                "inline-block";

            document.getElementById("fotoUtama").style.opacity =
                "1";

            document.getElementById("fotoUtama").style.transform =
                "scale(1)";

            document.getElementById("album").style.display =
                "none";

        }

    </script>

</body>
</html>
